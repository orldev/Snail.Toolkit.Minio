name: build and tests

# The shared library CI of Snail.Sdk: the tests, the API reference the build writes, the package validated against
# the last release. The MinIO image the tests pull is public, so no secret is needed; the secrets go along for the
# shared workflow's optional Docker Hub login, should the image ever need one again.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/lib-ci.yml@v1
    secrets: inherit
