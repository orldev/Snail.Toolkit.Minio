name: build and tests

# The shared library CI of Snail.Sdk: the tests, the API reference the build writes, the package validated against
# the last release. The secrets go along so the tests pull the MinIO image signed in to Docker Hub
# (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN), which refuses anonymous pulls.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/lib-ci.yml@v1
    secrets: inherit
